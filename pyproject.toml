[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sorani-subtitle-training"
version = "0.1.0"
description = "Provenance-aware English–Sorani subtitle data preparation and LoRA training"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets>=4.8.5,<5",
    "datasketch>=1.10,<2",
    "fasttext-wheel>=0.9.2,<1",
    # fasttext-wheel 0.9.2's predict API is incompatible with NumPy 2.x.
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    # PyArrow 26 wheels require NumPy 2 at runtime despite loose package metadata.
    "pyarrow>=21,<22",
    "pysubs2>=1.8.1,<2",
    "regex>=2024.0",
    "webvtt-py>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
    "PyJWT>=2.10,<3",
    "argon2-cffi>=23,<26",
    "python-multipart>=0.0.20,<1",
    "email-validator>=2,<3",
    "prometheus-client>=0.21,<1",
    "boto3>=1.35,<2",
]
api-test = ["httpx>=0.28,<1", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20,<1"]
train = [
    "torch>=2.6,<2.7",
    "transformers>=4.56.2,<4.57",
    "peft>=0.18.1,<0.19",
    "accelerate>=1.10.1,<1.11",
    "sacrebleu>=2.6,<3",
    # Newer SentencePiece protobuf bindings require protobuf 5+, conflicting with COMET 2.x.
    "sentencepiece>=0.2,<0.2.1",
    # COMET 2.x requires protobuf 4.x; TensorBoard and SentencePiece also support it.
    "protobuf>=4.25,<5",
    "tensorboard>=2.18,<3",
    "PyYAML>=6,<7",
]
eval = [
    "unbabel-comet>=2.2.7,<2.3",
    "protobuf>=4.25,<5",
    "sentencepiece>=0.2,<0.2.1",
    "sacrebleu>=2.6,<3",
]
wandb = ["wandb>=0.19,<1"]

[project.scripts]
sorani-build-dataset = "ml.data.build_dataset:main"
sorani-train = "ml.train.train_lora:main"
sorani-merge-adapter = "ml.train.merge_adapter:main"
sorani-evaluate = "ml.eval.evaluate:main"
sorani-translate = "ml.inference.pipeline:main"
sorani-create-admin = "api.db.seed:main"
sorani-create-demo = "api.db.seed_demo:main"

[tool.setuptools.packages.find]
include = ["ml*", "api*"]

[tool.setuptools.package-data]
"ml.train" = ["config.yaml"]
"api.db.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency and request-parameter declarations are framework markers.
"api/routes/*.py" = ["B008"]
"api/security.py" = ["B008"]
