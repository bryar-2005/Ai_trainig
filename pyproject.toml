[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sorani-subtitle-training"
version = "0.1.0"
description = "Local, provenance-aware English and Sorani subtitle data preparation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets>=4.8.5,<5",
    "datasketch>=1.10,<2",
    "fasttext-wheel>=0.9.2,<1",
    # fasttext-wheel 0.9.2's predict API is incompatible with NumPy 2.x.
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    # PyArrow 26 wheels require NumPy 2 at runtime despite loose package metadata.
    "pyarrow>=21,<22",
    "pysubs2>=1.8.1,<2",
    "webvtt-py>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
sorani-build-dataset = "ml.data.build_dataset:main"

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
