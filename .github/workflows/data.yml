name: Data, models, and backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install data and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check dependencies and lint
        run: |
          python -m pip check
          ruff check ml api tests
          ruff format --check ml api tests
      - name: Test data pipeline
        run: pytest -q

  training-cpu:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch, training, and evaluation dependencies
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,train,eval]'
          python -m pip check
      - name: Run offline training, evaluation, and inference tests
        run: pytest -q tests/test_train_*.py tests/test_eval_*.py tests/test_inference_*.py

  backend-postgres-celery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sorani
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sorani_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorani -d sorani_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SORANI_ENVIRONMENT: test
      SORANI_SECRET_KEY: test-only-secret-long-enough-for-ci-session-signing
      SORANI_DATABASE_URL: postgresql+asyncpg://sorani:test-only-password@localhost:5432/sorani_test
      SORANI_TEST_DATABASE_URL: postgresql+asyncpg://sorani:test-only-password@localhost:5432/sorani_test
      SORANI_TEST_REDIS_URL: redis://localhost:6379/14
      SORANI_TEST_BROKER_URL: redis://localhost:6379/15
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend and CPU model dependencies
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,api,api-test,train]'
          python -m pip check
      - name: Exercise PostgreSQL migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Exercise HTTP, PostgreSQL locks, Redis, Celery and real tiny models
        run: pytest -q tests/test_api*.py tests/test_account_frontend_support.py tests/test_model_identity_lightweight.py

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sorani
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sorani_frontend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorani -d sorani_frontend_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SORANI_ENVIRONMENT: test
      SORANI_SECRET_KEY: frontend-test-only-secret-at-least-32-bytes
      SORANI_DATABASE_URL: postgresql+asyncpg://sorani:test-only-password@localhost:5432/sorani_frontend_test
      SORANI_REDIS_URL: redis://localhost:6379/14
      SORANI_BROKER_URL: redis://localhost:6379/15
      SORANI_COOKIE_SECURE: 'false'
      SORANI_TASK_MODE: manual
      SORANI_STORAGE_ROOT: /tmp/sorani-frontend-test-files
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the real API and frontend
        run: |
          python -m pip install -e '.[api]'
          cd web && npm ci
      - name: Check types, lint, unit tests, dependencies and production build
        working-directory: web
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm audit --audit-level=high
          npm run build
      - name: Exercise browser workflows against PostgreSQL and the real API
        run: |
          alembic upgrade head
          uvicorn api.main:create_app --factory --host 0.0.0.0 --port 8000 > /tmp/sorani-api-test.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          timeout 60 bash -c 'until curl --silent --fail http://127.0.0.1:8000/health >/dev/null; do sleep 1; done'
          cd web
          npx playwright install --with-deps chromium
          npm run test:e2e
