name: Data, training, evaluation, and inference

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install data and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check dependencies and lint
        run: |
          python -m pip check
          ruff check ml tests
      - name: Test data pipeline
        run: pytest -q

  training-cpu:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch, training, and evaluation dependencies
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,train,eval]'
          python -m pip check
      - name: Run offline training, evaluation, and inference tests
        run: pytest -q tests/test_train_*.py tests/test_eval_*.py tests/test_inference_*.py
