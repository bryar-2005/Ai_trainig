# One direction is trained per run; change direction and output_dir for reverse translation.
base_model: facebook/nllb-200-distilled-600M
# Optional Hub revision; the resolved commit is recorded and reused on resume/merge.
base_revision: null
direction: en-ckb
dataset_dir: data/processed/subtitles/dataset
output_dir: outputs/nllb-600m-en-ckb-lora
context_sentences: 3
max_source_length: 256
max_target_length: 256
local_files_only: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, out_proj, fc1, fc2]

training:
  epochs: 3
  learning_rate: 0.0002
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_steps: 500
  eval_save_steps: 200
  logging_steps: 20
  save_total_limit: 3
  early_stopping_patience: 3
  gradient_checkpointing: true
  mixed_precision: auto
  generation_num_beams: 4
  seed: 42
  report_to: [tensorboard]
